version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8420:8420"
    volumes:
      - nexsys-data:/root/.nexsys
    environment:
      - NEXSYS_HOST=0.0.0.0
      - NEXSYS_PORT=8420
    restart: unless-stopped

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nexsys-data:
