# NEXSYS Pre-commit Configuration
# Install with: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - fastapi
          - pydantic
        files: ^backend/

  # Защита от захвата чужой работы: несколько сессий Claude Code часто
  # идут в одном дереве, и `git add -A` утаскивает чужие файлы в свой
  # коммит (случилось 24.08.2026). Осознанный большой коммит проходит с
  # NEXUS_BIG_COMMIT=1. Тот же скрипт ставится и без pre-commit — `make hooks`.
  - repo: local
    hooks:
      - id: no-blind-add-all
        name: Не захватывать работу соседней сессии
        entry: scripts/pre-commit
        language: script
        pass_filenames: false
        always_run: true
